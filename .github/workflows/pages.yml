# 部署介绍页 https://yangxiaomao.com/bilifast/ （仓库 Settings → Pages 的来源要选 GitHub Actions）
name: Pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build_site.mjs"
      - "extension/store/icon.svg"
      - "extension/icons/32.png"
      - "extension/manifest.json"
      - "docs/images/popup.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build_site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
