<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- Chrome 应用商店的小宣传图（440x280）。由 tools/make_icons.mjs 渲染成 jpg -->
<style>
  body { margin: 0; width: 440px; height: 280px; overflow: hidden; color: #fff;
         background: radial-gradient(circle at 85% 15%, #3a2a2e 0, #1d1f24 60%);
         font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  .box { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 36px; box-sizing: border-box; }
  .top { display: flex; align-items: center; gap: 14px; }
  img { width: 76px; height: 76px; margin: -9px; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; }
  .tag { margin: 22px 0 0; font-size: 21px; font-weight: 600; color: #ffb35c; }
  .note { margin: 8px 0 0; font-size: 15px; color: #c3c7cf; }
</style>
</head>
<body>
<div class="box">
  <div class="top"><img src="icon.svg" alt=""><h1>bilidl 播放加速</h1></div>
  <p class="tag">B 站 4K · 倍速 · 跳转，都不卡</p>
  <p class="note">只装一个插件，不用装其他程序，不收集任何数据</p>
</div>
</body>
</html>
